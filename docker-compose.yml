services:
  db:
    image: postgres:15-alpine
    container_name: hypersolutions_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audit_logs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: hypersolutions_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      # Overriding localhost with the 'db' service name for container networking
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/audit_logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: