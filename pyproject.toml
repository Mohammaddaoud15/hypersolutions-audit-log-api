[project]
name = "hypersolutions-audit-log-api"
version = "0.1.0"
description = "Compliance Audit Log Management System for HyperSolutions"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

