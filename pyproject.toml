[project]
name = "hypersolutions-audit-log-api"
version = "0.1.0"
description = "Compliance Audit Log Management System for HyperSolutions"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.32",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "Depends"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest-cov>=7.1.0",
    "types-python-jose>=3.5.0.20260408",
]

